    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TIMGAS Multi-Purpose Cooperative",
        "alternateName": "TIMGAS MPC",
        "description": "Member-owned cooperative in Trinidad, Bohol offering financial services, farm support, remittances, bills payment, and government service assistance.",
        "foundingDate": "1995-07-25",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Purok 5, Poblacion",
          "addressLocality": "Trinidad",
          "addressRegion": "Bohol",
          "addressCountry": "PH"
        },
        "telephone": "+639382242376",
        "email": "timgascooperative@gmail.com"
      }
    </script>
  </head>
  <body>
    <div id="loading-screen" aria-hidden="true">
      <span class="opening-panel"></span>
      <span class="opening-panel"></span>
      <span class="opening-panel"></span>
      <span class="opening-panel"></span>
    </div>

    <style>
      #loading-screen {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
        pointer-events: none;
      }

      .opening-panel {
        background: #123f2f;
        transform: translateY(0);
        transition: transform 680ms cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }

      .opening-panel:nth-child(2) {
        background: #18513d;
        transition-delay: 110ms;
      }

      .opening-panel:nth-child(3) {
        background: #23694f;
        transition-delay: 220ms;
      }

      .opening-panel:nth-child(4) {
        background: #2f765b;
        transition-delay: 330ms;
      }

      #loading-screen.is-opening .opening-panel {
        transform: translateY(-100%);
      }

      @media (prefers-reduced-motion: reduce) {
        .opening-panel {
          transition-duration: 1ms;
          transition-delay: 0ms !important;
        }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
